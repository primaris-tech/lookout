[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookout"
version = "0.0.1"
description = "Self-hosted forward-looking alerts for NWS Storm Prediction Center outlooks and mesoscale discussions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "shapely>=2.0",
    "apprise>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
lookout = "lookout.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lookout"]
