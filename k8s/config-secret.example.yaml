# Lookout — config Secret template
#
# !! DO NOT COMMIT THIS FILE WITH REAL VALUES !!
#
# 1. Copy this file:       cp k8s/config-secret.example.yaml k8s/config-secret.yaml
# 2. Fill in your real config.yml content under stringData.config\.yml
# 3. Apply:                kubectl apply -f k8s/config-secret.yaml
# 4. Keep the file local or store it in a secrets manager (Vault, SOPS, etc.)
#
# config-secret.yaml is already listed in .gitignore (see below).
# Add it if it isn't:
#   echo "k8s/config-secret.yaml" >> .gitignore

---
apiVersion: v1
kind: Secret
metadata:
  name: lookout-config
  namespace: lookout
  labels:
    app.kubernetes.io/name: lookout
    app.kubernetes.io/component: config
type: Opaque
# stringData is plaintext here for readability; Kubernetes stores it base64-encoded.
stringData:
  config.yml: |
    # Paste the full contents of your config.yml here.
    # See config.example.yml for the full schema.

    user_agent_contact: "you@example.com"

    alert_threshold: MRGL

    locations:
      home:
        lat: 35.7796
        lon: -78.6382

    products:
      convective_outlook:
        days: [1, 2, 3, 4, 5, 6, 7, 8]
        notify_on:
          - first_appearance
          - risk_upgrade
          - day_shift_closer
          - risk_cleared
      mesoscale_discussion:
        enabled: true

    notification_channels:
      my_phone: "ntfys://your-private-topic"        # replace with real URL
      family_discord: "discord://webhook_id/token"  # replace with real URL

    notification_rules:
      - name: "All alerts for home"
        locations: [home]
        channels: [my_phone]

    polling:
      interval_minutes: 10
      meta_alert_after_minutes: 60

    state_retention_days: 30
